version: 0.2

# Helper buildspec, run with --buildspec-override. CodeBuild acts as the
# courier for the Lambda artefacts: this session's sandbox is proxy-blocked
# from S3, but the build container has full AWS reach.
# Bucket comes from ${ARTIFACTS_BUCKET} — never hardcode it.
phases:
  build:
    commands:
      - "pip install --platform manylinux2014_x86_64 --implementation cp --python-version 3.12 --only-binary=:all: --target python supabase boto3"
      - "zip -r deps-layer.zip python"
      - "aws s3 cp deps-layer.zip s3://${ARTIFACTS_BUCKET}/deps-layer.zip"
      - "zip -j handler.zip worker/lambda_distributor.py"
      - "aws s3 cp handler.zip s3://${ARTIFACTS_BUCKET}/handler.zip"
